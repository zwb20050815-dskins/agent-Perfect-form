# 10.3：在原Redis+API配置上，替换为带访问口令的API入口。
services:
  api:
    image: knowledge-agent-api:lesson10c
    command: ["python", "-m", "uvicorn", "lesson10c:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    volumes:
      - type: bind
        source: ./.env.access
        target: /app/.env.access
        read_only: true
        bind:
          create_host_path: false
